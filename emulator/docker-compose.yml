# =====================================================================================
# LOCAL DEVELOPMENT INFRASTRUCTURE
# -------------------------------------------------------------------------------------
# Runs Microsoft's official Azure Service Bus emulator locally via Docker, so the
# full origination -> funding -> servicing event flow can be tested end-to-end
# without a real Azure subscription — plus a real SQL Server instance the three
# .NET applications use for their own persistent data (same engine as Azure SQL
# in production, just running locally instead of in the cloud).
#
# Usage: docker compose up -d   (from this /emulator directory)
#   - Service Bus emulator listens on localhost:5672 (AMQP)
#   - SQL Server for app data listens on localhost:14333
# Both match the connection strings in each service's appsettings.Development.json.
# =====================================================================================
services:
  # ---------------------------------------------------------------------------------
  # Internal plumbing for the Service Bus emulator ONLY — not reachable from the
  # host, not meant for application data. See sql-local below for that.
  # ---------------------------------------------------------------------------------
  sqledge:
    container_name: servicebus-emulator-sql
    image: mcr.microsoft.com/azure-sql-edge:latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Sample_Password123!"  # local dev only — never use in production
    networks:
      - sb-emulator

  servicebus-emulator:
    container_name: servicebus-emulator
    image: mcr.microsoft.com/azure-messaging/servicebus-emulator:latest
    depends_on:
      - sqledge
    environment:
      SQL_SERVER: sqledge
      MSSQL_SA_PASSWORD: "Sample_Password123!"
      ACCEPT_EULA: "Y"
    ports:
      - "5672:5672"
    volumes:
      - ./config.json:/ServiceBus_Emulator/ConfigFiles/Config.json
    networks:
      - sb-emulator

  # ---------------------------------------------------------------------------------
  # SQL Server for the three applications' own data — separate from sqledge above.
  # Exposed on the host at localhost:14333 (non-default port, to avoid clashing with
  # any other local SQL Server instance you might already have on the standard 1433).
  # Each service creates and owns its own database on this shared server instance
  # (EF Core's Database.EnsureCreated() creates the database itself on first run —
  # no manual setup needed).
  # ---------------------------------------------------------------------------------
  sql-local:
    container_name: tienfs-sql-local
    image: mcr.microsoft.com/azure-sql-edge:latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Sample_Password123!"  # local dev only — never use in production
    ports:
      - "14333:1433"
    networks:
      - sb-emulator

networks:
  sb-emulator:
