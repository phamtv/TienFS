# =====================================================================================
# LOCAL DEVELOPMENT INFRASTRUCTURE
# -------------------------------------------------------------------------------------
# Runs Microsoft's official Azure Service Bus emulator locally via Docker, so the
# full origination -> funding -> servicing event flow can be tested end-to-end
# without a real Azure subscription — plus THREE separate SQL Server instances,
# one per microservice, matching the "each service owns its own database, on its
# own server" isolation used in production (see infra/main.bicep).
#
# Usage: docker compose up -d   (from this /emulator directory)
#   - Service Bus emulator : localhost:5672  (AMQP)
#   - Origination database : localhost:14331
#   - Funding database     : localhost:14332
#   - Servicing database   : localhost:14333
# All match the connection strings in each service's appsettings.Development.json.
#
# Running three separate SQL Server containers (rather than one shared instance) is
# more resource-hungry than sharing — expect this to use noticeably more memory than
# earlier versions of this file. If your machine is memory-constrained, this is the
# trade-off for accurately simulating "no shared failure domain between services."
# =====================================================================================
services:
  # ---------------------------------------------------------------------------------
  # Internal plumbing for the Service Bus emulator ONLY — not reachable from the
  # host, not meant for application data.
  # ---------------------------------------------------------------------------------
  sqledge:
    container_name: servicebus-emulator-sql
    image: mcr.microsoft.com/azure-sql-edge:latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Sample_Password123!"  # local dev only — never use in production
    networks:
      - sb-emulator

  servicebus-emulator:
    container_name: servicebus-emulator
    image: mcr.microsoft.com/azure-messaging/servicebus-emulator:latest
    depends_on:
      - sqledge
    environment:
      SQL_SERVER: sqledge
      MSSQL_SA_PASSWORD: "Sample_Password123!"
      ACCEPT_EULA: "Y"
    ports:
      - "5672:5672"
    volumes:
      - ./config.json:/ServiceBus_Emulator/ConfigFiles/Config.json
    networks:
      - sb-emulator

  # ---------------------------------------------------------------------------------
  # One SQL Server instance PER SERVICE — true isolation, not just separate
  # databases on a shared server. Each is fully independent: if one crashes, the
  # other two services are unaffected.
  # ---------------------------------------------------------------------------------
  sql-origination:
    container_name: tienfs-sql-origination
    image: mcr.microsoft.com/azure-sql-edge:latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Sample_Password123!"  # local dev only — never use in production
    ports:
      - "14331:1433"
    networks:
      - sb-emulator

  sql-funding:
    container_name: tienfs-sql-funding
    image: mcr.microsoft.com/azure-sql-edge:latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Sample_Password123!"
    ports:
      - "14332:1433"
    networks:
      - sb-emulator

  sql-servicing:
    container_name: tienfs-sql-servicing
    image: mcr.microsoft.com/azure-sql-edge:latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Sample_Password123!"
    ports:
      - "14333:1433"
    networks:
      - sb-emulator

networks:
  sb-emulator:
